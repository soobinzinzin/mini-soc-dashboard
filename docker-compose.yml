networks:
  net-hq:
    driver: bridge
  net-serverfarm:
    driver: bridge
  net-dmz:
    driver: bridge
  net-central:
    driver: bridge

volumes:
  pgdata:

services:
  postgres:
    image: postgres:15-alpine
    container_name: soc-postgres
    networks:
      - net-central
    environment:
      - POSTGRES_DB=minisoc
      - POSTGRES_USER=minisoc
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minisoc -d minisoc"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  attacker:
    build: ./attacker
    container_name: attacker
    networks:
      - net-hq
      - net-serverfarm
      - net-dmz
    tty: true

  # ---------- Site A: Headquarters ----------
  victim-hq:
    build: ./victim
    container_name: victim-hq
    networks:
      - net-hq
    cap_add:
      - NET_ADMIN

  sensor-hq:
    build: ./sensor
    container_name: sensor-hq
    network_mode: "service:victim-hq"   # sensor "soi" đúng traffic của victim-hq
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./logs/hq:/var/log/snort
    depends_on:
      - victim-hq

  # ---------- Site B: Server Farm ----------
  victim-serverfarm:
    build: ./victim
    container_name: victim-serverfarm
    networks:
      - net-serverfarm
    cap_add:
      - NET_ADMIN

  sensor-serverfarm:
    build: ./sensor
    container_name: sensor-serverfarm
    network_mode: "service:victim-serverfarm"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./logs/serverfarm:/var/log/snort
    depends_on:
      - victim-serverfarm

  # ---------- Site C: Web DMZ ----------
  victim-dmz:
    build: ./victim
    container_name: victim-dmz
    networks:
      - net-dmz
    cap_add:
      - NET_ADMIN

  sensor-dmz:
    build: ./sensor
    container_name: sensor-dmz
    network_mode: "service:victim-dmz"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./logs/dmz:/var/log/snort
    depends_on:
      - victim-dmz

  # ---------- Central Ingestion API ----------
  soc-central:
    build: ./central
    container_name: soc-central
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - net-central
    environment:
      - DATABASE_URL=postgresql://minisoc:${POSTGRES_PASSWORD}@soc-postgres:5432/minisoc
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------- Telemetry Forwarding Agents ----------
  agent-hq:
    build: ./agent
    container_name: agent-hq
    networks:
      - net-central
    environment:
      - INGESTION_URL=http://soc-central:8000/api/v1/telemetry
      - SENSOR_ID=sensor-hq
      - SENSOR_SITE=hq
      - ALERT_FILE=/var/log/snort/alert
    volumes:
      - ./logs/hq:/var/log/snort:ro
    depends_on:
      - soc-central
    restart: unless-stopped

  agent-serverfarm:
    build: ./agent
    container_name: agent-serverfarm
    networks:
      - net-central
    environment:
      - INGESTION_URL=http://soc-central:8000/api/v1/telemetry
      - SENSOR_ID=sensor-serverfarm
      - SENSOR_SITE=serverfarm
      - ALERT_FILE=/var/log/snort/alert
    volumes:
      - ./logs/serverfarm:/var/log/snort:ro
    depends_on:
      - soc-central
    restart: unless-stopped

  agent-dmz:
    build: ./agent
    container_name: agent-dmz
    networks:
      - net-central
    environment:
      - INGESTION_URL=http://soc-central:8000/api/v1/telemetry
      - SENSOR_ID=sensor-dmz
      - SENSOR_SITE=dmz
      - ALERT_FILE=/var/log/snort/alert
    volumes:
      - ./logs/dmz:/var/log/snort:ro
    depends_on:
      - soc-central
    restart: unless-stopped

  # ---------- Web Dashboard ----------
  soc-dashboard:
    build: ./dashboard
    container_name: soc-dashboard
    networks:
      - net-central
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - soc-central
    restart: unless-stopped

