# Config tối giản cho lab Docker — đủ để demo, không cần preprocessor phức tạp
var HOME_NET any
var EXTERNAL_NET any
var RULE_PATH /etc/snort/rules

config checksum_mode: none

include $RULE_PATH/local.rules

# Ghi alert ra file (xem bằng: docker exec <sensor> tail -f /var/log/snort/alert)
output alert_fast: /var/log/snort/alert
